[package]
name = "fluent-assertions"
version = "0.5.0"
authors = ["Hauke Jung <hauke.jung@outlook.de>"]
documentation = "https://docs.rs/fluent-assertions"
repository = "https://github.com/hauju/fluent-assertions-rs.git"
license = "MIT OR Apache-2.0"
description = "A Rust testing library that enhances readability and expressiveness by enabling natural language-like syntax for test assertions."
keywords = ["assertions", "fluent", "testing"]
categories = ["development-tools"]
readme = "README.md"
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
num-traits = "0.2.19"

[dev-dependencies]
rstest = "0.26.1"